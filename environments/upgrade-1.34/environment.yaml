# A cluster one minor behind, for the kubeadm upgrade drill.
#
# Identical in shape to `standard` apart from the version pin and one worker
# instead of two: the drill needs exactly one worker to demonstrate `kubeadm
# upgrade node` and the drain around it, and the second saves 2.5 GiB for
# nothing. Roughly 6.5 GiB of guest RAM.
#
# kube-node.sh already produces exactly the starting state the exercise needs:
# the apt repository pinned to this minor, and kubelet/kubeadm/kubectl held with
# `apt-mark hold`. Re-pointing the repository and lifting the holds is the
# learner's job, as it is on the exam. No provisioning change is needed.
#
# Note that a kubeadm upgrade is one-way: nothing here can put 1.35 back to
# 1.34, so the drill runs once per `dojo env reset`. Every upgrade lab opens
# with a version guard that refuses rather than handing back a free pass.
schemaVersion: 1
id: upgrade-1.34
description: Workstation + 1 control plane + 1 worker on Kubernetes 1.34, for the upgrade drill

provisioning: kubeadm

kubernetes:
  # One minor behind the exam's 1.35, and the newest patch on that line. The
  # upgrade target is whatever `standard` pins.
  version: "1.34.11"
  podSubnet: "10.244.0.0/16"
  serviceSubnet: "10.96.0.0/12"

cni:
  # The 3.32 line is tested against Kubernetes 1.34-1.36, so it spans the
  # upgrade without needing to move.
  version: "v3.32.1"
  provider: calico

addons:
  # The full set, matching `standard`. kubeadmProvision runs the addon steps
  # unconditionally, so trimming this would render empty version templates.
  metricsServer: "v0.9.0"
  helm: "v3.21.4"
  localPathProvisioner: "v0.0.37"
  ingressNginx: "controller-v1.15.1"
  gatewayAPI: "v1.6.1"
  nginxGatewayFabric: "v2.7.0"

network:
  lima: user-v2
  subnet: "192.168.104.0/24"

nodes:
  - name: terminal
    role: workstation
    cpus: 2
    memory: "1GiB"
    disk: "16GiB"
  - name: cp1
    role: control-plane
    cpus: 2
    memory: "3GiB"
    disk: "24GiB"
  - name: worker1
    role: worker
    cpus: 2
    memory: "2500MiB"
    disk: "24GiB"
