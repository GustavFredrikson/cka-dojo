# Published competencies with no exercise behind them yet. `dojo readiness`
# prints these alongside its verdict, so a learner is never told they are
# ready on the strength of labs that exist while the exam also tests things
# this content set does not cover. Delete an entry the day a lab lands.
knownGaps:
  - id: ha-control-plane
    name: Highly-available control plane
    domain: cluster-architecture
    note: >-
      The `ha` profile and module 18 exist, and the engine path is proven -- three
      stacked etcd members, healthy, behind a load-balanced endpoint. The three
      labs have not been through the authoring loop yet, because a full five-VM
      build keeps stalling on Lima's usernet wedging under that many machines
      (ROADMAP section 7). Treat them as unverified until that is resolved, and
      keep studying this elsewhere.
  - id: extension-interfaces
    name: Extension interfaces (CNI, CSI, CRI)
    domain: cluster-architecture
    note: >-
      CRI and CSI are covered: `cri-inspect` reads the runtime through crictl,
      and `csi-provisioner-restore` repairs dynamic provisioning at the
      provisioner rather than at the claim. What is left is replacing a CNI on
      a running cluster, which cannot be made resettable on a shared profile --
      a swap leaves CRDs, iptables rules and interfaces behind. `cni-install`
      on the raw profile covers installing one from nothing; replacing one on a
      live cluster stays deliberately out of scope.
