  - id: affinity
    name: Node and Pod affinity
  - id: topology-spread
    name: Topology spread constraints
  - id: resource-quotas
    name: ResourceQuota
  - id: limit-ranges
    name: LimitRange
  - id: services
    name: Services
  - id: selectors
    name: Label selectors
  - id: endpointslices
    name: EndpointSlices
  - id: service-debugging
    name: Service troubleshooting
  - id: nodeport
    name: NodePort Services
  - id: ingress
