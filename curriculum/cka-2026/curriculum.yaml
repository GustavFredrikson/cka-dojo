  - id: application-troubleshooting
    name: Application troubleshooting
  - id: health-probes
    name: Health probes
  - id: autoscaling
    name: Workload autoscaling
  - id: resource-observability
    name: Resource usage and logs
  - id: kubectl-workflows
    name: kubectl workflows
  - id: scheduling
