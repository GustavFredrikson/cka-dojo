apiVersion: v1
kind: Namespace
metadata: {name: dojo-ingress-inspect}
---
apiVersion: v1
kind: ConfigMap
metadata: {name: shop-content, namespace: dojo-ingress-inspect}
data:
  index.html: "served-by-shop\n"
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: shop, namespace: dojo-ingress-inspect}
spec:
  replicas: 1
  selector: {matchLabels: {app: shop}}
  template:
    metadata: {labels: {app: shop}}
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports: [{containerPort: 80}]
          volumeMounts:
            # Served at /usr/share/nginx/html/shop so a path-prefix rule finds a real file there
            # and no rewrite annotation is needed.
            - {name: content, mountPath: /usr/share/nginx/html/shop}
          resources:
            requests: {cpu: 25m, memory: 32Mi}
      volumes:
        - name: content
          configMap: {name: shop-content}
---
apiVersion: v1
kind: Service
metadata: {name: shop, namespace: dojo-ingress-inspect}
spec:
  selector: {app: shop}
  ports: [{name: http, port: 80, targetPort: 80}]
---
apiVersion: v1
kind: ConfigMap
metadata: {name: api-content, namespace: dojo-ingress-inspect}
data:
  index.html: "served-by-api\n"
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: api, namespace: dojo-ingress-inspect}
spec:
  replicas: 1
  selector: {matchLabels: {app: api}}
  template:
    metadata: {labels: {app: api}}
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports: [{containerPort: 80}]
          volumeMounts:
            # Served at /usr/share/nginx/html/api so a path-prefix rule finds a real file there
            # and no rewrite annotation is needed.
            - {name: content, mountPath: /usr/share/nginx/html/api}
          resources:
            requests: {cpu: 25m, memory: 32Mi}
      volumes:
        - name: content
          configMap: {name: api-content}
---
apiVersion: v1
kind: Service
metadata: {name: api, namespace: dojo-ingress-inspect}
spec:
  selector: {app: api}
  ports: [{name: http, port: 80, targetPort: 80}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: client, namespace: dojo-ingress-inspect}
spec:
  replicas: 1
  selector: {matchLabels: {app: client}}
  template:
    metadata: {labels: {app: client}}
    spec:
      containers:
        - name: client
          image: busybox:1.36
          command: ["sh", "-c", "sleep 3600"]
          resources:
            requests: {cpu: 25m, memory: 16Mi}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: {name: storefront, namespace: dojo-ingress-inspect}
spec:
  ingressClassName: nginx
  rules:
    - host: store.dojo.test
      http:
        paths:
          - path: /shop
            pathType: Prefix
            backend: {service: {name: shop, port: {number: 80}}}
          - path: /api
            pathType: Exact
            backend: {service: {name: api, port: {number: 80}}}
