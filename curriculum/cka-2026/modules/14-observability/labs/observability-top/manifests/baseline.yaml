apiVersion: v1
kind: Namespace
metadata: {name: dojo-observability-top}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: grinder, namespace: dojo-observability-top}
spec:
  replicas: 1
  selector: {matchLabels: {app: grinder}}
  template:
    metadata: {labels: {app: grinder}}
    spec:
      containers:
        - name: grinder
          image: busybox:1.36
          command: ["sh", "-c", "while true; do :; done"]
          resources:
            requests: {cpu: 50m, memory: 16Mi}
            limits: {cpu: 200m, memory: 32Mi}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: dozer, namespace: dojo-observability-top}
spec:
  replicas: 1
  selector: {matchLabels: {app: dozer}}
  template:
    metadata: {labels: {app: dozer}}
    spec:
      containers:
        - name: dozer
          image: busybox:1.36
          command: ["sh", "-c", "sleep 3600"]
          resources:
            requests: {cpu: 400m, memory: 16Mi}
            limits: {cpu: 500m, memory: 32Mi}
