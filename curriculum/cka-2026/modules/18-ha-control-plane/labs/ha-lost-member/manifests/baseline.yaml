apiVersion: v1
kind: Namespace
metadata: {name: dojo-ha-lost-member}
---
# Something that keeps running throughout, so the learner can see that losing
# one control plane does not cost the cluster its workloads.
apiVersion: apps/v1
kind: Deployment
metadata: {name: ledger, namespace: dojo-ha-lost-member}
spec:
  replicas: 2
  selector: {matchLabels: {app: ledger}}
  template:
    metadata: {labels: {app: ledger}}
    spec:
      containers:
        - name: ledger
          image: busybox:1.36
          command: [sleep, "3600"]
