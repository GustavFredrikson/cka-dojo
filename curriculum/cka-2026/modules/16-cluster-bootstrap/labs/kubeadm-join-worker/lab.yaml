schemaVersion: 1
id: kubeadm-join-worker
title: Join a worker to the cluster
learningStage: build
prerequisites: [cni-install]
domain: [cluster-architecture]
skills: [kubeadm, cluster-bootstrap, kubelet, node-maintenance, scheduling]
difficulty: 3
targetMinutes: 20
environment: {profile: raw}

# Setup builds a working single-node cluster -- control plane and pod network --
# and leaves worker1 bare. Five to seven minutes on every start and reset, said
# plainly in task.md.
setup:
  faults:
    - type: nodeExec
      node: cp1
      script: |
        systemctl stop kubelet || true
        kubeadm reset -f --cri-socket=unix:///run/containerd/containerd.sock >/dev/null 2>&1 || true
        rm -rf /etc/kubernetes /var/lib/etcd /var/lib/kubelet/pki \
               /etc/cni/net.d /var/lib/cni /root/.kube /home/student/.kube
        iptables -F || true
        iptables -t nat -F || true
        iptables -t mangle -F || true
        iptables -X || true
        ip link delete cni0 2>/dev/null || true
        ip link delete flannel.1 2>/dev/null || true
        systemctl restart containerd
        crictl rmp -fa >/dev/null 2>&1 || true
        echo "cp1 is bare"
      undo: 'true'

    - type: nodeExec
      node: worker1
      script: |
        systemctl stop kubelet || true
        kubeadm reset -f --cri-socket=unix:///run/containerd/containerd.sock >/dev/null 2>&1 || true
        rm -rf /etc/kubernetes /var/lib/kubelet/pki /etc/cni/net.d /var/lib/cni
        iptables -F || true
        iptables -t nat -F || true
        systemctl restart containerd
        test ! -e /etc/kubernetes/kubelet.conf
        echo "worker1 is bare"
      undo: 'true'

    - type: nodeExec
      node: cp1
      script: |
        set -euo pipefail
        # Not /etc/hosts: Ubuntu's own `127.0.1.1 cp1` line comes before the
        # block the engine writes, so a naive grep picks loopback and kubeadm
        # refuses with "unable to select an IP from lo network interface".
        # /etc/default/kubelet is authoritative -- the engine pinned it.
        ip=$(sed -n 's/.*--node-ip=\([0-9.]*\).*/\1/p' /etc/default/kubelet)
        test -n "$ip"
        kubeadm init \
          --apiserver-advertise-address="$ip" \
          --pod-network-cidr=10.244.0.0/16 \
          --service-cidr=10.96.0.0/12 \
          --node-name=cp1 \
          --cri-socket=unix:///run/containerd/containerd.sock >/dev/null
        mkdir -p /root/.kube
        install -m 0600 /etc/kubernetes/admin.conf /root/.kube/config
        export KUBECONFIG=/etc/kubernetes/admin.conf
        for _ in $(seq 1 60); do
          kubectl get --raw=/readyz >/dev/null 2>&1 && break
          sleep 2
        done
        kubectl apply -f https://github.com/flannel-io/flannel/releases/latest/download/kube-flannel.yml >/dev/null
        kubectl -n kube-system rollout status deploy/coredns --timeout=5m >/dev/null
        echo "single-node cluster is up"
      undo: 'true'

    - type: nodeExec
      node: cp1
      # A workload that cannot run until the worker joins: it is pinned to
      # worker1, so it stays Pending and its Deployment stays unavailable.
      # Grading it is how "the worker really joined" becomes one check.
      script: |
        set -euo pipefail
        export KUBECONFIG=/etc/kubernetes/admin.conf
        kubectl apply -f - <<'MANIFEST'
        apiVersion: v1
        kind: Namespace
        metadata: {name: dojo-kubeadm-join-worker}
        ---
        apiVersion: apps/v1
        kind: Deployment
        metadata: {name: batch, namespace: dojo-kubeadm-join-worker}
        spec:
          replicas: 2
          selector: {matchLabels: {app: batch}}
          template:
            metadata: {labels: {app: batch}}
            spec:
              nodeSelector: {kubernetes.io/hostname: worker1}
              containers:
                - name: batch
                  image: busybox:1.36
                  command: [sleep, "3600"]
        MANIFEST
        sleep 10
        avail=$(kubectl -n dojo-kubeadm-join-worker get deploy batch \
          -o jsonpath='{.status.availableReplicas}')
        if [ -n "$avail" ] && [ "$avail" -gt 0 ]; then
          echo "the workload scheduled; worker1 was already in the cluster" >&2
          exit 1
        fi
        echo "batch is Pending with nowhere to run"
      undo: |
        export KUBECONFIG=/etc/kubernetes/admin.conf
        kubectl delete namespace dojo-kubeadm-join-worker \
          --ignore-not-found --wait=false >/dev/null 2>&1 || true

    - type: nodeExec
      node: terminal
      script: |
        set -euo pipefail
        install -d -o student -g student -m 0700 /home/student/.kube
        runuser -u student -- env HOME=/home/student ssh \
          -i /home/student/.ssh/id_ed25519 \
          -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
          cp1 'sudo cat /etc/kubernetes/admin.conf' > /home/student/.kube/config
        chown student:student /home/student/.kube/config
        chmod 0600 /home/student/.kube/config
        echo "workstation kubeconfig installed"
      undo: |
        rm -rf /home/student/.kube || true

grading:
  all:
    - {type: nodeReady, node: worker1, ready: true, schedulable: true}
    - {type: nodeFile, node: worker1, path: /etc/kubernetes/kubelet.conf, contains: client-certificate}
    - type: nodeService
      node: worker1
      unit: kubelet
      state: active
      enabled: true

    # The one that proves the join actually works rather than merely registering.
    - type: deploymentAvailable
      namespace: dojo-kubeadm-join-worker
      name: batch
      minReplicas: 2

    - type: command
      target: cp1
      description: the cluster has exactly the two nodes it should
      command: |
        set -euo pipefail
        test "$(kubectl get nodes -o name | wc -l)" = 2
        echo "two nodes registered"
      stdout: {contains: two nodes registered}

hints:
  - A Deployment is Pending because nothing in the cluster can run it. Look at
    where it is asking to be scheduled, then at which nodes exist.
  - >-
    `worker1` is prepared exactly as cp1 was -- containerd, the kubelet and
    kubeadm are installed and nothing is configured. It has to be told to join,
    and the command to do that has to come from the control plane, because it
    carries a token and a hash of the cluster's CA.
  - >-
    `kubeadm token create --print-join-command`, run on cp1, prints the whole
    command including both credentials. Tokens expire after 24 hours, so mint a
    fresh one rather than looking for the one `kubeadm init` printed earlier.
  - |
    On cp1:

    ```
    sudo kubeadm token create --print-join-command
    ```

    Copy what it prints, then on worker1:

    ```
    sudo <that command> --cri-socket=unix:///run/containerd/containerd.sock
    ```

    Then watch from the workstation:

    ```
    kubectl get nodes -w
    kubectl -n dojo-kubeadm-join-worker get pods -o wide
    ```

exam: {eligible: false}
conflicts:
  - cluster.bootstrap
  - namespace:dojo-kubeadm-join-worker
  - cp1.kubeadm
  - worker1.kubeadm
  - terminal.path:/home/student/.kube/config
