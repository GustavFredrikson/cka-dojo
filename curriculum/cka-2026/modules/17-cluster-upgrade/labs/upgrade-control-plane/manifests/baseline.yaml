apiVersion: v1
kind: Namespace
metadata: {name: dojo-upgrade-control-plane}
---
# Lands on worker1, because of the control-plane taint. That is the point: it
# stays available across the whole control-plane upgrade and proves the learner
# did not take the cluster down to do it.
apiVersion: apps/v1
kind: Deployment
metadata: {name: ledger, namespace: dojo-upgrade-control-plane}
spec:
  replicas: 2
  selector: {matchLabels: {app: ledger}}
  template:
    metadata: {labels: {app: ledger}}
    spec:
      containers:
        - name: ledger
          image: busybox:1.36
          command: [sleep, "3600"]
