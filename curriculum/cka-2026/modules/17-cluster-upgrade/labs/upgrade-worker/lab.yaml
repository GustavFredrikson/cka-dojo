schemaVersion: 1
id: upgrade-worker
title: Upgrade the worker without dropping the app
learningStage: guided-fix
prerequisites: [upgrade-control-plane]
domain: [cluster-architecture]
skills: [kubeadm, cluster-upgrade, node-maintenance, kubelet, scheduling]
difficulty: 3
targetMinutes: 20
environment: {profile: upgrade-1.34}

setup:
  apply: [manifests/baseline.yaml]
  waitReady:
    - {namespace: dojo-upgrade-worker, kind: deployment, name: ledger}
  faults:
    # This lab starts where upgrade-control-plane finished, and says so rather
    # than failing confusingly halfway through.
    - type: nodeExec
      node: cp1
      script: |
        v=$(kubeadm version -o short)
        case "$v" in
          v1.35.*)
            echo "the control plane is on $v, as this lab expects"
            ;;
          *)
            echo "cp1 is on $v, not 1.35." >&2
            echo "Run upgrade-control-plane first: a worker must never lead the" >&2
            echo "API server, so the control plane is upgraded before the nodes." >&2
            exit 1
            ;;
        esac
      undo: 'true'

    - type: nodeExec
      node: worker1
      # Same one-way guard as the control-plane lab, for the same reason.
      script: |
        v=$(kubeadm version -o short)
        case "$v" in
          v1.34.*)
            echo "worker1 is on $v; the drill can run"
            ;;
          *)
            echo "worker1 is already on $v." >&2
            echo "A kubeadm upgrade is one-way, so this drill cannot be reset in place." >&2
            echo "Rebuild with \`dojo env reset --profile upgrade-1.34\` to run it again." >&2
            exit 1
            ;;
        esac
      undo: 'true'

    - type: nodeExec
      node: worker1
      script: |
        apt-mark hold kubelet kubeadm kubectl >/dev/null
        printf 'deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/v1.34/deb/ /\n' \
          > /etc/apt/sources.list.d/kubernetes.list
        chmod 0644 /etc/apt/sources.list.d/kubernetes.list
        apt-mark showhold | grep -q '^kubeadm$'
        echo "worker1 is pinned to the v1.34 package repository"
      undo: 'true'

grading:
  all:
    - type: command
      target: worker1
      description: the kubeadm binary on worker1 is from the 1.35 line
      command: kubeadm version -o short
      stdout: {matches: '^v1\.35\.\d+$'}

    # kubeadm upgrade node writes no static Pod manifests on a worker, so the
    # kubelet version IS the proof that the upgrade happened.
    - type: jsonPath
      kind: node
      name: worker1
      path: '{.status.nodeInfo.kubeletVersion}'
      matches: '^v1\.35\.\d+$'

    - {type: nodeReady, node: worker1, ready: true, schedulable: true}
    - type: nodeService
      node: worker1
      unit: kubelet
      state: active
      enabled: true

    # Three replicas behind a PodDisruptionBudget of minAvailable: 2, all
    # pinned to worker1. A drain that ignores the budget would take the app
    # below it; this is the check that says the maintenance was done properly.
    - type: deploymentAvailable
      namespace: dojo-upgrade-worker
      name: ledger
      minReplicas: 3

    - type: command
      target: worker1
      description: the Kubernetes packages are held again, the way you found them
      command: |
        set -euo pipefail
        held=$(apt-mark showhold)
        printf '%s' "$held" | grep -q '^kubelet$'
        printf '%s' "$held" | grep -q '^kubeadm$'
        echo "packages are held"
      stdout: {contains: packages are held}

hints:
  - The procedure is the one you used on the control plane, with one command
    different. `kubeadm upgrade apply` is for the first control-plane node;
    there is a sibling subcommand for every other node in the cluster.
  - >-
    The same two obstacles are in place on this node: the packages are held and
    the repository points at the old minor. Both are per-node -- fixing them on
    cp1 did nothing for worker1.
  - >-
    This node is running the workload, so draining it actually moves something.
    There is a PodDisruptionBudget in the way, which is the point: it is telling
    you how much of the app is allowed to be down at once. Look at where those
    Pods can go.
  - |
    On worker1:

    ```
    sudo sed -i 's#/v1\.34/#/v1.35/#' /etc/apt/sources.list.d/kubernetes.list
    sudo apt-get update
    sudo apt-mark unhold kubeadm
    sudo apt-get install -y kubeadm=<1.35 version>
    sudo apt-mark hold kubeadm
    sudo kubeadm upgrade node
    ```

    Then, from the workstation:

    ```
    kubectl drain worker1 --ignore-daemonsets --delete-emptydir-data
    ```

    and back on worker1:

    ```
    sudo apt-mark unhold kubelet kubectl
    sudo apt-get install -y kubelet=<version> kubectl=<version>
    sudo apt-mark hold kubelet kubectl
    sudo systemctl daemon-reload && sudo systemctl restart kubelet
    ```

    finally:

    ```
    kubectl uncordon worker1
    ```

    If the drain will not complete, read what it says about the disruption
    budget rather than reaching for `--force` or `--disable-eviction`.

exam: {eligible: false}
conflicts:
  - namespace:dojo-upgrade-worker
  - cluster.version
  - worker1.kubeadm
