apiVersion: v1
kind: Namespace
metadata: {name: dojo-upgrade-worker}
---
# Three replicas that tolerate the control-plane taint, so they can live on
# either node. That matters: draining worker1 has to be able to move them
# somewhere, or the PodDisruptionBudget below would be unsatisfiable and the
# drain would block forever with no correct way out.
apiVersion: apps/v1
kind: Deployment
metadata: {name: ledger, namespace: dojo-upgrade-worker}
spec:
  replicas: 3
  selector: {matchLabels: {app: ledger}}
  template:
    metadata: {labels: {app: ledger}}
    spec:
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      containers:
        - name: ledger
          image: busybox:1.36
          command: [sleep, "3600"]
---
# The reason `kubectl drain --ignore-daemonsets` alone is not the whole answer:
# eviction has to respect this, so the drain proceeds a Pod at a time and waits
# for replacements to become ready.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: ledger, namespace: dojo-upgrade-worker}
spec:
  minAvailable: 2
  selector: {matchLabels: {app: ledger}}
