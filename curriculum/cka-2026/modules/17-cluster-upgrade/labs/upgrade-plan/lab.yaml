schemaVersion: 1
id: upgrade-plan
title: Read the upgrade plan
learningStage: inspect
domain: [cluster-architecture]
skills: [kubeadm, cluster-upgrade, control-plane-components, kubelet]
difficulty: 2
targetMinutes: 10
environment: {profile: upgrade-1.34}

# Mutates nothing, so this is the one lab in the module that repeats. Run it
# before spending the drill: the two labs after it consume the environment.
setup:
  faults:
    - type: nodeExec
      node: cp1
      script: |
        v=$(kubeadm version -o short)
        case "$v" in
          v1.34.*)
            echo "cp1 is on $v"
            ;;
          *)
            echo "cp1 is already on $v, so there is no upgrade left to read." >&2
            echo "Rebuild with \`dojo env reset --profile upgrade-1.34\` first." >&2
            exit 1
            ;;
        esac
      undo: 'true'

checkpoints:
  - id: current-minor
    task: |
      What Kubernetes minor is this cluster on right now? Give it as `1.xx`.
    answer:
      accepted: ["1.34"]

  - id: repo-minor
    task: |
      Read `/etc/apt/sources.list.d/kubernetes.list` on cp1. The Kubernetes apt
      repositories carry one minor each. Which minor does this node's list
      point at? Give it as `v1.xx`.
    answer:
      accepted: ["v1.34", "1.34"]
      caseInsensitive: true

  - id: holds
    task: |
      Run `apt-mark showhold` on cp1. Those packages cannot be upgraded until
      the hold is lifted. Which apt-mark subcommand lifts it? One word.
    answer:
      accepted: ["unhold", "apt-mark unhold"]
      caseInsensitive: true

  - id: plan-target
    task: |
      Run `sudo kubeadm upgrade plan` on cp1. Read the `Target version:` line.
      It is not 1.35. What does it say? Give it as `v1.xx.yy`.
    answer:
      accepted: ["v1.34.11", "1.34.11"]
      caseInsensitive: true

  - id: why-not-135
    task: |
      That target is capped by one thing, and the same output tells you what:
      compare the `kubeadm version:` line with what you were hoping to upgrade
      to. Which package therefore has to be upgraded *before* kubeadm will even
      plan a move to 1.35? One word.
    answer:
      accepted: ["kubeadm"]
      caseInsensitive: true

  - id: manual-component
    task: |
      Once the upgrade does run, one component is left for you to upgrade by
      hand on every node -- `kubeadm upgrade` never moves it, because it is an
      OS package rather than something kubeadm wrote. Which one?
    answer:
      accepted: ["kubelet"]
      caseInsensitive: true

  - id: skew
    task: |
      How many minor versions may a kubelet lag behind the API server and still
      be supported? Give the number.
    answer:
      accepted: ["3", "three"]
      caseInsensitive: true

  - id: order
    task: |
      Which do you upgrade first, the control plane or the workers? One word:
      `control-plane` or `workers`.
    answer:
      accepted: ["control-plane", "control plane", "controlplane", "the control plane"]
      caseInsensitive: true

grading:
  all:
    # Nothing should have changed. This lab is the repeatable one precisely
    # because it only reads.
    - type: command
      target: cp1
      description: the cluster is still on the minor it started on
      command: kubeadm version -o short
      stdout: {matches: '^v1\.34\.\d+$'}
    - type: command
      target: cp1
      description: the packages are still held
      command: |
        set -euo pipefail
        apt-mark showhold | grep -q '^kubeadm$'
        echo "still held"
      stdout: {contains: still held}
    - {type: nodeReady, node: cp1, ready: true, schedulable: true}
    - {type: nodeReady, node: worker1, ready: true, schedulable: true}

exam: {eligible: false}
conflicts: []
