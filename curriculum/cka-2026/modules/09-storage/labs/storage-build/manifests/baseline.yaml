apiVersion: v1
kind: Namespace
metadata: {name: dojo-storage-build}
---
apiVersion: v1
kind: PersistentVolume
metadata: {name: dojo-storage-build}
spec:
  capacity: {storage: 2Gi}
  accessModes: [ReadWriteOnce]
  storageClassName: dojo-static-build
  persistentVolumeReclaimPolicy: Delete
  hostPath: {path: /var/lib/dojo/storage-build, type: DirectoryOrCreate}
