schemaVersion: 1
id: storage-follow
title: Bind and mount a static volume
learningStage: follow
domain: [storage]
skills: [persistent-volumes, persistent-volume-claims, storage-binding]
difficulty: 1
targetMinutes: 9
environment: {profile: standard}
setup:
  apply: [manifests/baseline.yaml]
checkpoints:
  - id: inspect-volume
    task: Inspect PV `dojo-storage-follow`. Which storage class does it require?
    answer: {accepted: [dojo-static], caseInsensitive: true}
  - id: claim
    task: |
      Create a claim named `data` in `dojo-storage-follow` requesting `512Mi`,
      `ReadWriteOnce`, and storage class `dojo-static`. Wait for it to bind,
      then run `dojo check`.
    grading:
      all:
        - type: jsonPath
          kind: pvc
          namespace: dojo-storage-follow
          name: data
          path: "{.status.phase}"
          equals: Bound
  - id: mount
    task: |
      Create Pod `writer` using image `busybox:1.36`, command `sleep 3600`, and
      mount claim `data` at `/data`. Wait for scheduling, then run `dojo check`.
    grading:
      all:
        - {type: podScheduled, namespace: dojo-storage-follow, name: writer}
grading:
  all:
    - type: jsonPath
      kind: pvc
      namespace: dojo-storage-follow
      name: data
      path: "{.status.phase}"
      equals: Bound
    - {type: podScheduled, namespace: dojo-storage-follow, name: writer}
exam: {eligible: false}
conflicts: [namespace:dojo-storage-follow, pv:dojo-storage-follow]
