apiVersion: v1
kind: Namespace
metadata: {name: dojo-workloads-probe}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: web, namespace: dojo-workloads-probe}
spec:
  replicas: 2
  selector: {matchLabels: {app: web}}
  template:
    metadata: {labels: {app: web}}
    spec:
      containers:
        - name: web
          image: nginx:1.27-alpine
          ports: [{containerPort: 80}]
          readinessProbe:
            httpGet: {path: /, port: 8081}
            initialDelaySeconds: 1
            periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata: {name: web, namespace: dojo-workloads-probe}
spec:
  selector: {app: web}
  ports: [{port: 80, targetPort: 80}]
