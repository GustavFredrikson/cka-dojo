apiVersion: v1
kind: Namespace
metadata: {name: dojo-workloads-inspect}
---
apiVersion: v1
kind: ConfigMap
metadata: {name: web-config, namespace: dojo-workloads-inspect}
data: {APP_MODE: production}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: web, namespace: dojo-workloads-inspect}
spec:
  replicas: 3
  selector: {matchLabels: {app: web}}
  template:
    metadata: {labels: {app: web}}
    spec:
      containers:
        - name: web
          image: nginx:1.27-alpine
          envFrom:
            - configMapRef: {name: web-config}
          resources: {requests: {cpu: 10m, memory: 16Mi}}
