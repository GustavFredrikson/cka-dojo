apiVersion: v1
kind: Namespace
metadata: {name: dojo-workloads-guided}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: web, namespace: dojo-workloads-guided}
spec:
  replicas: 2
  selector: {matchLabels: {app: web}}
  template:
    metadata: {labels: {app: web}}
    spec:
      containers:
        - name: web
          image: nginx:1.27-alpine
          resources: {requests: {cpu: 10m, memory: 16Mi}}
