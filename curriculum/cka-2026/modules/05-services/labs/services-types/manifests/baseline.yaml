apiVersion: v1
kind: Namespace
metadata: {name: dojo-services-types}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: web, namespace: dojo-services-types}
spec:
  replicas: 2
  selector: {matchLabels: {app: web}}
  template:
    metadata: {labels: {app: web}}
    spec:
      containers: [{name: web, image: nginx:1.27-alpine, ports: [{containerPort: 80}]}]
---
# Starts as a plain ClusterIP. Part of the task is changing what it is.
apiVersion: v1
kind: Service
metadata: {name: web, namespace: dojo-services-types}
spec:
  type: ClusterIP
  selector: {app: web}
  ports: [{port: 80, targetPort: 80}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: dnsprobe, namespace: dojo-services-types}
spec:
  replicas: 1
  selector: {matchLabels: {app: dnsprobe}}
  template:
    metadata: {labels: {app: dnsprobe}}
    spec:
      containers: [{name: dnsprobe, image: busybox:1.36, command: [sleep, '3600']}]
