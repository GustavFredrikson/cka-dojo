apiVersion: v1
kind: Namespace
metadata: {name: dojo-services-port}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: api, namespace: dojo-services-port}
spec:
  replicas: 2
  selector: {matchLabels: {app: api}}
  template:
    metadata: {labels: {app: api}}
    spec:
      containers: [{name: api, image: nginx:1.27-alpine, ports: [{containerPort: 80}]}]
---
apiVersion: v1
kind: Service
metadata: {name: api, namespace: dojo-services-port}
spec:
  selector: {app: api}
  ports: [{port: 8080, targetPort: 8080}]
