apiVersion: v1
kind: Namespace
metadata: {name: dojo-services-nodeport}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: web, namespace: dojo-services-nodeport}
spec:
  replicas: 2
  selector: {matchLabels: {app: web}}
  template:
    metadata: {labels: {app: web}}
    spec:
      containers: [{name: web, image: nginx:1.27-alpine, ports: [{containerPort: 80}]}]
