# The namespace enforces the `restricted` Pod Security Standard. The Deployment
# declares no securityContext at all, so admission refuses every Pod it tries
# to create -- and, as with a ResourceQuota rejection, no Pod object is ever
# created, so the error lives on the ReplicaSet.
apiVersion: v1
kind: Namespace
metadata:
  name: dojo-psa
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: report, namespace: dojo-psa}
spec:
  replicas: 2
  selector: {matchLabels: {app: report}}
  template:
    metadata: {labels: {app: report}}
    spec:
      containers:
        - name: report
          image: busybox:1.36
          command: ["sleep", "3600"]
