apiVersion: v1
kind: Namespace
metadata: {name: dojo-quota-blocked}
---
apiVersion: v1
kind: ResourceQuota
metadata: {name: team-quota, namespace: dojo-quota-blocked}
spec:
  hard:
    pods: "6"
    requests.cpu: "1"
    requests.memory: 1Gi
    limits.cpu: "2"
    limits.memory: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: worker, namespace: dojo-quota-blocked}
spec:
  replicas: 2
  selector: {matchLabels: {app: worker}}
  template:
    metadata: {labels: {app: worker}}
    spec:
      containers:
        - name: worker
          image: nginx:1.27-alpine
