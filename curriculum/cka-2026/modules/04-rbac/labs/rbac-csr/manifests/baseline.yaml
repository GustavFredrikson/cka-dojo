apiVersion: v1
kind: Namespace
metadata: {name: dojo-rbac-csr}
---
# Something for the new identity to be able to list, and to be refused from
# deleting.
apiVersion: apps/v1
kind: Deployment
metadata: {name: ledger, namespace: dojo-rbac-csr}
spec:
  replicas: 2
  selector: {matchLabels: {app: ledger}}
  template:
    metadata: {labels: {app: ledger}}
    spec:
      containers: [{name: ledger, image: busybox:1.36, command: [sleep, '3600']}]
