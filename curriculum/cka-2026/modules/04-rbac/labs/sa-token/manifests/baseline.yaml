apiVersion: v1
kind: Namespace
metadata: {name: dojo-sa-token}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: ledger, namespace: dojo-sa-token}
spec:
  replicas: 1
  selector: {matchLabels: {app: ledger}}
  template:
    metadata: {labels: {app: ledger}}
    spec:
      containers: [{name: ledger, image: busybox:1.36, command: [sleep, '3600']}]
