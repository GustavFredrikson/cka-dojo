apiVersion: v1
kind: Namespace
metadata: {name: dojo-rbac-guided}
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: builder, namespace: dojo-rbac-guided}
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: wrong-subject, namespace: dojo-rbac-guided}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: pod-reader, namespace: dojo-rbac-guided}
rules:
  - {apiGroups: [""], resources: [pods], verbs: [get, list, watch]}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: builder-pods, namespace: dojo-rbac-guided}
subjects:
  - {kind: ServiceAccount, name: wrong-subject, namespace: dojo-rbac-guided}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: pod-reader}
