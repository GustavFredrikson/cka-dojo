apiVersion: v1
kind: Namespace
metadata:
  name: dojo-statefulset-build
---
# Scaffolding, not the exercise: a class the volumeClaimTemplate can name.
# WaitForFirstConsumer because local-path provisions on the node the Pod lands
# on, so the volume cannot exist before the scheduler has decided.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: dojo-statefulset
provisioner: rancher.io/local-path
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Delete
