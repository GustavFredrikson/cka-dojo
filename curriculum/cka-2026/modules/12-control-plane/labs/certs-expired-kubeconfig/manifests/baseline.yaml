apiVersion: v1
kind: Namespace
metadata: {name: dojo-certs-expired-kubeconfig}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: ledger, namespace: dojo-certs-expired-kubeconfig}
spec:
  replicas: 2
  selector: {matchLabels: {app: ledger}}
  template:
    metadata: {labels: {app: ledger}}
    spec:
      containers:
        - name: ledger
          image: busybox:1.36
          command: [sleep, "3600"]
---
# Bound to the User and not to the group, deliberately. A learner who renews
# with `kubeadm kubeconfig user` and forgets --org still gets a credential that
# works, which keeps the lesson on renewal rather than on RBAC subjects.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: operator, namespace: dojo-certs-expired-kubeconfig}
rules:
  - apiGroups: [""]
    resources: [pods, pods/log]
    verbs: [get, list, watch]
  - apiGroups: ["apps"]
    resources: [deployments, replicasets]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: operator, namespace: dojo-certs-expired-kubeconfig}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: operator}
subjects:
  - {apiGroup: rbac.authorization.k8s.io, kind: User, name: dojo-operator}
