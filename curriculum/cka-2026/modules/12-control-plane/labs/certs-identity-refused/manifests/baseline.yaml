apiVersion: v1
kind: Namespace
metadata: {name: dojo-certs-identity-refused}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: invoices, namespace: dojo-certs-identity-refused}
spec:
  replicas: 2
  selector: {matchLabels: {app: invoices}}
  template:
    metadata: {labels: {app: invoices}}
    spec:
      containers:
        - name: invoices
          image: busybox:1.36
          command: [sleep, "3600"]
---
# This authorization is correct and stays correct. Every variant of this lab
# breaks the credential, never the binding -- so a learner who "fixes" the
# RoleBinding has misdiagnosed, and grading says so.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: billing, namespace: dojo-certs-identity-refused}
rules:
  - apiGroups: [""]
    resources: [pods, pods/log]
    verbs: [get, list, watch]
  - apiGroups: ["apps"]
    resources: [deployments, replicasets]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: billing, namespace: dojo-certs-identity-refused}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: billing}
subjects:
  - {apiGroup: rbac.authorization.k8s.io, kind: User, name: dojo-billing}
