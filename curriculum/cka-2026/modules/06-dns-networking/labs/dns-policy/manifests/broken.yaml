apiVersion: v1
kind: Namespace
metadata: {name: dojo-dns-policy}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: dnscheck, namespace: dojo-dns-policy}
spec:
  replicas: 1
  selector: {matchLabels: {app: dnscheck}}
  template:
    metadata: {labels: {app: dnscheck}}
    spec:
      dnsPolicy: Default
      containers: [{name: dnscheck, image: busybox:1.36, command: [sleep, '3600']}]
