apiVersion: v1
kind: Namespace
metadata: {name: dojo-coredns-down}
---
# A name to resolve, and something to resolve it from. Both healthy: whatever
# goes wrong here is not in this namespace.
apiVersion: apps/v1
kind: Deployment
metadata: {name: web, namespace: dojo-coredns-down}
spec:
  replicas: 1
  selector: {matchLabels: {app: web}}
  template:
    metadata: {labels: {app: web}}
    spec:
      containers: [{name: web, image: nginx:1.27-alpine, ports: [{containerPort: 80}]}]
---
apiVersion: v1
kind: Service
metadata: {name: web, namespace: dojo-coredns-down}
spec:
  selector: {app: web}
  ports: [{port: 80, targetPort: 80}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: dnsprobe, namespace: dojo-coredns-down}
spec:
  replicas: 1
  selector: {matchLabels: {app: dnsprobe}}
  template:
    metadata: {labels: {app: dnsprobe}}
    spec:
      containers: [{name: dnsprobe, image: busybox:1.36, command: [sleep, '3600']}]
