apiVersion: v1
kind: Namespace
metadata: {name: dojo-dns-service}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: api, namespace: dojo-dns-service}
spec:
  replicas: 2
  selector: {matchLabels: {app: api}}
  template:
    metadata: {labels: {app: api}}
    spec:
      containers: [{name: api, image: nginx:1.27-alpine, ports: [{containerPort: 80}]}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: client, namespace: dojo-dns-service}
spec:
  replicas: 1
  selector: {matchLabels: {app: client}}
  template:
    metadata: {labels: {app: client}}
    spec:
      containers: [{name: client, image: busybox:1.36, command: [sleep, '3600']}]
