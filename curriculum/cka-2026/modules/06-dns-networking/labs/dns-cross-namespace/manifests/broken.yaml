apiVersion: v1
kind: Namespace
metadata: {name: dojo-dns-frontend}
---
apiVersion: v1
kind: Namespace
metadata: {name: dojo-dns-backend}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: api, namespace: dojo-dns-backend}
spec:
  replicas: 1
  selector: {matchLabels: {app: api}}
  template:
    metadata: {labels: {app: api}}
    spec:
      containers: [{name: api, image: nginx:1.27-alpine}]
---
apiVersion: v1
kind: Service
metadata: {name: api, namespace: dojo-dns-backend}
spec:
  selector: {app: api}
  ports: [{port: 80, targetPort: 80}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: frontend, namespace: dojo-dns-frontend}
spec:
  replicas: 1
  selector: {matchLabels: {app: frontend}}
  template:
    metadata: {labels: {app: frontend}}
    spec:
      containers:
        - name: frontend
          image: busybox:1.36
          command: [sh, -c, 'wget -qO- http://api/ >/dev/null && sleep 3600']
