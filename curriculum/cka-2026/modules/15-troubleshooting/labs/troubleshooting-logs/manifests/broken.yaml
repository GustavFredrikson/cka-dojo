apiVersion: v1
kind: Namespace
metadata: {name: dojo-troubleshooting-logs}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: collector, namespace: dojo-troubleshooting-logs}
spec:
  replicas: 1
  selector: {matchLabels: {app: collector}}
  template:
    metadata: {labels: {app: collector}}
    spec:
      containers:
        - {name: web, image: nginx:1.27-alpine}
        - name: reporter
          image: busybox:1.36
          command: [sh, -c, 'echo FATAL: configuration path missing >&2; exit 1']
