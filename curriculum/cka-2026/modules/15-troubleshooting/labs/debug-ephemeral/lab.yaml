schemaVersion: 1
id: debug-ephemeral
title: Debug a container with no shell
learningStage: inspect
prerequisites: [troubleshooting-logs]
domain: [troubleshooting, workloads-scheduling]
skills: [ephemeral-containers, init-containers, application-troubleshooting, secrets, kubectl-workflows]
difficulty: 3
targetMinutes: 12
environment: {profile: standard}
setup:
  # No waitReady: it is implemented as `kubectl rollout status`, which a bare
  # Pod has none of. The Pod is Running within seconds of the manifest landing.
  apply: [manifests/baseline.yaml]
checkpoints:
  - id: exec-fails
    task: |
      Try `kubectl -n dojo-debug-ephemeral exec -it vault -- sh`. Which
      executable does the error say could not be found in `$PATH`?
    answer:
      accepted: [sh, /bin/sh, '"sh"']
      caseInsensitive: true
  - id: attach
    task: |
      Attach an ephemeral container named `sleuth` to Pod `vault`, using image
      `busybox:1.36` and targeting the `vault` container, then run `dojo check`.
    grading:
      all:
        - type: command
          description: an ephemeral container is attached to vault and shares its process namespace
          command: |
            kubectl -n dojo-debug-ephemeral get pod vault \
              -o jsonpath='{range .spec.ephemeralContainers[*]}{.targetContainerName}{"\n"}{end}' \
              | grep -qx vault
  - id: pid
    task: |
      From inside `sleuth`, which PID does the `vault` container's process have
      in the namespace you are now sharing?
    answer: {accepted: ["1"]}
grading:
  all:
    # Tolerant on purpose. `kubectl debug` writes to a subresource that is
    # append-only: an ephemeral container cannot be removed, renamed or given
    # a different security profile once it is attached. A learner whose first
    # attempt used the default profile is stuck with that container for the
    # life of the Pod, so grading asks whether *an* ephemeral container is
    # attached to the right target -- not whether one particular name worked.
    - type: command
      description: an ephemeral container is attached to vault, sharing its process namespace
      command: |
        kubectl -n dojo-debug-ephemeral get pod vault \
          -o jsonpath='{range .spec.ephemeralContainers[*]}{.targetContainerName}{"\n"}{end}' \
          | grep -qx vault
    # The Pod must be the original, still running. An ephemeral container is
    # added to a live Pod; recreating it is the thing this feature exists to
    # avoid.
    - type: jsonPath
      kind: pod
      namespace: dojo-debug-ephemeral
      name: vault
      path: "{.status.phase}"
      equals: Running
    - type: jsonPath
      kind: pod
      namespace: dojo-debug-ephemeral
      name: vault
      path: "{.status.containerStatuses[0].restartCount}"
      equals: "0"
    - type: command
      description: Secret token/recovered holds the value found inside the container
      command: |
        got=$(kubectl -n dojo-debug-ephemeral get secret recovered \
          -o jsonpath='{.data.token}' | base64 -d)
        test "$got" = 7c2f9a5e1b
exam: {eligible: true}
conflicts: [namespace:dojo-debug-ephemeral]
