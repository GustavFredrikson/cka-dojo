apiVersion: v1
kind: Namespace
metadata: {name: dojo-debug-ephemeral}
---
# A container with no shell, no package manager and no debugging tools of any
# kind, holding a file that only exists at runtime. `kubectl exec` cannot help
# here: there is nothing in the image to exec.
#
# The token is written by an init container rather than mounted from a
# ConfigMap, and it is base64 in the spec rather than plaintext, so that
# reading the Pod definition does not hand over the answer at a glance. It is
# still recoverable that way -- grading requires the ephemeral container to
# exist for exactly that reason.
apiVersion: v1
kind: Pod
metadata:
  name: vault
  namespace: dojo-debug-ephemeral
  labels: {app: vault}
spec:
  initContainers:
    - name: seed
      image: busybox:1.36
      command:
        - sh
        - -c
        - printf '%s' N2MyZjlhNWUxYg== | base64 -d > /run/vault/token
      volumeMounts:
        - {name: state, mountPath: /run/vault}
  containers:
    - name: vault
      image: registry.k8s.io/pause:3.10
      volumeMounts:
        - {name: state, mountPath: /run/vault}
  volumes:
    - name: state
      emptyDir: {}
